[project]
name = "cit-engine"
version = "0.1.0"
description = "CIT Crunch Week scheduling engine: checker, CP-SAT solvers and API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "ortools>=9.15.6755",
    "pydantic>=2.14.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
