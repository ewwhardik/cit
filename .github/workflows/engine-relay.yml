# Solver relay: runs one long engine job (generate, repair, change evaluation,
# resilience scan) on a 4-vCPU GitHub-hosted runner and streams the result back
# to the web app. Started by the web app through workflow_dispatch; it only reads
# the repository and never pushes.
name: Engine relay
run-name: "Solve ${{ inputs.job }}"

on:
  workflow_dispatch:
    inputs:
      job:
        description: Relay job id (created by the web app)
        required: true
        type: string

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENGINE_SHARED_SECRET: ${{ secrets.ENGINE_SHARED_SECRET }}
      ENGINE_SOLVER_WORKERS: "4"
      ENGINE_JOB_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
          prune-cache: false

      - name: Install engine
        working-directory: engine
        run: uv sync --frozen --no-dev

      - name: Start engine
        working-directory: engine
        # Run from the venv directly so no uv process holds the cache lock in the background.
        run: nohup .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > engine.log 2>&1 &

      - name: Run job
        working-directory: engine
        env:
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
          RELAY_JOB_ID: ${{ inputs.job }}
        run: .venv/bin/python relay_worker.py

      - name: Engine log
        if: always()
        working-directory: engine
        run: |
          tail -n 40 engine.log || true
          pkill -f "uvicorn app.main:app" || true
